[tool.black]
line-length = 127
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/venv/*", "*/__pycache__/*"]

[tool.pylint.main]
max-line-length = 127
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0621",  # Redefining name from outer scope
]

[tool.bandit]
exclude_dirs = ["tests", "test_*.py", "venv", "__pycache__"]
# B101: assert_used in test files
# B601: shell_injection in test files  
# B104: hardcoded_bind_all_interfaces (existing findings baselined)
# B113: request_without_timeout (existing findings baselined)
# B608: hardcoded_sql_expressions (existing finding baselined)
skips = ["B101", "B601", "B104", "B113", "B608"]
