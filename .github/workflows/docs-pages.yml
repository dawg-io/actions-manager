name: Publish Public Documentation Site

# This file does NOT run in this repository. promote-to-public.yml deletes
# .github/workflows/ from the sanitized export and then installs this file as
# .github/workflows/docs-pages.yml in dawg-io/actions-manager, which is where it
# runs. It is staged outside .github/workflows/ so it never executes here, where
# it would publish a second Pages site from the same docs.
#
# Two documentation workflows exist and both are live. Do not merge them:
#   "Deploy Documentation to GitHub Pages" (pages.yml, this repository)
#       serves actionsmanager.io, release-gated on a closed review issue.
#   "Publish Public Documentation Site"    (this file, dawg-io/actions-manager)
#       serves dawg-io.github.io/actions-manager.
# The release process refers to workflows by name, so these names must stay
# distinct.
#
# "main" below is the PUBLIC repository's branch, which is what this workflow
# runs against. .github/scripts/check_no_main_refs.py only scans
# .github/workflows/*.yml, so this file is correctly outside its glob - do not
# "fix" that by widening the glob, and do not retarget this to develop: the
# public repository has no develop branch.

on:
  # Primary trigger. Releases are created in the public repository by
  # promote-to-public.yml, so this fires natively - no repository_dispatch.
  release:
    types: [published]
  # Manual republish without cutting a release.
  workflow_dispatch:
  # A docs-only fix ships without waiting for a release.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Never cancel a release deploy because a docs push landed behind it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On a release, build the tag rather than main. promote-to-public.yml
          # creates the release from the release/<version> commit WITHOUT waiting
          # for the promotion PR to merge, so main can still be the previous
          # release when this fires. The tag already carries the new docs.
          # Empty on every other trigger, which checks out the pushed or
          # dispatched ref as usual.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail

          # The base path is resolved here, at build time, never committed.
          # configure-pages reports what Pages is actually serving:
          # "/actions-manager" for a project site, and "" once a custom domain
          # is set. So moving the docs to a domain needs no change to this
          # workflow or to docs/_config.yml - only the Pages setting itself.
          #
          # url has to be overridden as well as baseurl. docs/_config.yml pins
          # url to the production domain, which jekyll-seo-tag and
          # jekyll-sitemap emit as absolute URLs; left alone on a project site
          # they advertise https://<domain>/actions-manager/..., which resolves
          # nowhere. The overlay is generated, so nothing about the site's own
          # config changes.
          BASE_URL="${BASE_URL%/}"
          ORIGIN="${BASE_URL%"$BASE_PATH"}"
          printf 'url: "%s"\nbaseurl: "%s"\n' "$ORIGIN" "$BASE_PATH" > _config.public.yml
          echo "Building with url=$ORIGIN baseurl=$BASE_PATH"

          bundle exec jekyll build --config _config.yml,_config.public.yml

      - name: Verify generated site
        run: |
          set -euo pipefail

          # Fail rather than publish an empty site over a working one.
          test -s _site/index.html
          test -s _site/assets/js/search-data.json

          # A CNAME in the artifact makes this site claim the production custom
          # domain, which would take actionsmanager.io off the repository that
          # actually serves it. promote-to-public.yml strips docs/CNAME from the
          # export; this is the backstop for a copy that predates that, or one
          # added by hand.
          #
          # The follow-up issue that moves the custom domain here is the one
          # that removes this check - set the domain in the Pages settings, do
          # not reintroduce a committed CNAME.
          if [ -e _site/CNAME ]; then
            echo "::error::_site/CNAME is present - refusing to publish a site that claims the production domain."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
